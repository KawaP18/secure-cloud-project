entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":8443"

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic

api:
  dashboard: true

log:
  level: INFO

accessLog: {}
